[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "heic2jpg"
version = "2.2.1"
description = "Fast HEIC to JPEG converter"
readme = "README.md"
keywords = [
  "batch",
  "heic",
  "image-conversion",
  "jpeg",
  "jpg",
  "pillow",
  "pillow-heif",
]
license = { text = "MIT" }
authors = [
  { name = "Luis Gómez Gutiérrez" },
]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: End Users/Desktop",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Multimedia :: Graphics :: Graphics Conversion",
  "Topic :: Utilities",
]
dependencies = [
  "packaging>=26.2",
  "pillow>=12.3",
  "pillow-heif>=1.4",
]
urls.Homepage = "https://github.com/lucuma13/heic2jpg"
scripts.heic2jpg = "heic2jpg.heic2jpg:main"

[dependency-groups]
dev = [
  "hypothesis",
  "pre-commit",
  "pytest",
  "pytest-cov",
  "pytest-mock",
  "ruff",
  "taplo",
  "ty",
]

[tool.hatch]
build.targets.wheel.packages = [ "src/heic2jpg/" ]
build.targets.sdist.include = [ "/src/heic2jpg/", "/tests/" ]
build.targets.sdist.exclude = [ "/.github/" ]

[tool.uv]
managed = true

[tool.ruff]
line-length = 120
lint.select = [
  "A",    # flake8-builtins
  "ANN",  # flake8-annotations
  "B",    # flake8-bugbear
  "BLE",  # flake8-blind-except
  "C",    # flake8-comprehensions + mccabe
  "DTZ",  # flake8-datetimez
  "E",    # pycodestyle errors
  "F",    # Pyflakes
  "FLY",  # flynt
  "FURB", # refurb
  "I",    # isort
  "PERF", # Perflint
  "PGH",  # pygrep-hooks
  "PIE",  # flake8-pie
  "PL",   # Pylint
  "PT",   # flake8-pytest-style
  "RET",  # flake8-return
  "RSE",  # flake8-raise
  "RUF",  # Ruff-specific
  "S",    # flake8-bandit (security)
  "SIM",  # flake8-simplify
  "TC",   # flake8-type-checking
  "UP",   # pyupgrade
  "W",    # pycodestyle warnings
]
lint.ignore = [
  "E501", # line too long — ruff format handles this
]
lint.per-file-ignores."tests/*" = [
  "ANN",     # annotations on tests add noise without value
  "PLR2004", # exact values in assertions are the point
  "S101",    # asserts are the point of a test
]

[tool.pytest]
ini_options.addopts = "--strict-markers --cov=src --cov-branch --cov-report=term-missing --cov-report=xml"
